DATA:
    ROOT: ''
    TRAIN_FILE: ''
    VAL_FILE: ''
    DATASET: kinetics400
    NUM_FRAMES: 8
    NUM_CLASSES: 400
    LABEL_LIST: 'labels/kinetics_400_labels.csv'
    BATCH_SIZE: 8
MODEL:
  TYPE: videofocalnet_base
  NAME: video-focalnet_base
  DROP_PATH_RATE: 0.1
  NUM_CLASSES: 400
  FOCAL:
    EMBED_DIM: 128
    DEPTHS: [2, 2, 18, 2]
    FOCAL_LEVELS: [2, 2, 2, 2]
    FOCAL_WINDOWS: [3, 3, 3, 3]
  LABEL_SMOOTHING: 0.1 
TRAIN:
  BASE_LR: 5e-4
  WARMUP_LR: 5e-7
  MIN_LR: 5e-6
  EPOCHS: 51
  WEIGHT_DECAY: 0.05
  OPTIMIZER:
    NAME: "adamw"
  WARMUP_EPOCHS: 20
  PRETRAINED_PATH: 'focalnet_base_srf.pth'
AUG:
  FRAME_INTERVAL: 2
  FLIP_RATIO: 0.5
  COLOR_JITTER: 0.8
  GRAY_SCALE: 0.2
  MIXUP: 0.8
  MIXUP_PROB: 0.5
SAVE_FREQ: 5
